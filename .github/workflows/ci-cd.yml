name: CI/CD Pipeline

on:
push:
branches: [ main, develop ]
pull_request:
branches: [ main, develop ]
schedule:
- cron: '0 2 * * *'

env:
PYTHON_VERSION: '3.11'
REGISTRY: ghcr.io

jobs:

# -------------------------

# CODE QUALITY

# -------------------------

code-quality:
runs-on: ubuntu-latest
name: Code Quality Checks

```
steps:
  - uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: ${{ env.PYTHON_VERSION }}
      cache: 'pip'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install black isort flake8 mypy pytest pytest-cov

  - name: Set PYTHONPATH
    run: echo "PYTHONPATH=." >> $GITHUB_ENV

  - name: Run Black check
    run: black --check .

  - name: Run isort check
    run: isort --check-only .

  - name: Run Flake8
    run: flake8 .

  - name: Run MyPy
    run: mypy . --ignore-missing-imports
    continue-on-error: true
```

# -------------------------

# SECURITY SCAN

# -------------------------

security:
runs-on: ubuntu-latest
name: Security Scan

```
permissions:
  contents: read
  security-events: write

steps:
  - uses: actions/checkout@v4

  - name: Run Trivy scan
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: 'fs'
      scan-ref: '.'
      format: 'sarif'
      output: 'trivy-results.sarif'

  - name: Upload SARIF results
    uses: github/codeql-action/upload-sarif@v3
    if: always()
    with:
      sarif_file: trivy-results.sarif
```

# -------------------------

# UNIT TESTS

# -------------------------

unit-tests:
runs-on: ubuntu-latest
name: Unit Tests

```
services:
  cassandra:
    image: cassandra:4.1
    ports:
      - 9042:9042
    options: >-
      --health-cmd="cqlsh -e 'describe keyspaces'"
      --health-interval=30s
      --health-timeout=20s
      --health-retries=10

steps:
  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: ${{ env.PYTHON_VERSION }}
      cache: 'pip'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest pytest-cov pytest-asyncio cassandra-driver

  - name: Wait for Cassandra
    run: |
      for i in {1..30}; do
        nc -z localhost 9042 && echo "Cassandra ready" && break
        echo "Waiting Cassandra..."
        sleep 10
      done

  - name: Initialize schema
    run: |
      python -c "
```

from cassandra.cluster import Cluster
cluster = Cluster(['127.0.0.1'])
session = cluster.connect()
session.execute("CREATE KEYSPACE IF NOT EXISTS arxiv WITH replication = {'class':'SimpleStrategy','replication_factor':1}")
"

```
  - name: Run tests
    run: pytest tests/ -v --cov=. --cov-report=xml
```

# -------------------------

# INTEGRATION TESTS

# -------------------------

integration-tests:
runs-on: ubuntu-latest
needs: unit-tests

```
services:
  cassandra:
    image: cassandra:4.1
    ports:
      - 9042:9042

steps:
  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: ${{ env.PYTHON_VERSION }}

  - name: Install dependencies
    run: |
      pip install -r requirements.txt
      pip install pytest pytest-asyncio cassandra-driver

  - name: Wait Cassandra
    run: sleep 60

  - name: Run integration tests
    run: pytest tests/integration -v
```

# -------------------------

# BUILD DOCKER

# -------------------------

build:
runs-on: ubuntu-latest
needs: [unit-tests, security]
if: github.event_name == 'push'

```
permissions:
  contents: read
  packages: write

steps:
  - uses: actions/checkout@v4

  - name: Set up Docker
    uses: docker/setup-buildx-action@v2

  - name: Login GHCR
    uses: docker/login-action@v2
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build image
    uses: docker/build-push-action@v4
    with:
      context: .
      push: true
      tags: ghcr.io/${{ github.repository }}:latest
```

# -------------------------

# STATUS CHECK

# -------------------------

status:
runs-on: ubuntu-latest
needs: [code-quality, security, unit-tests, build]
if: always()

```
steps:
  - name: Pipeline Status
    run: |
      if [[ "${{ needs.code-quality.result }}" == "failure" || \
            "${{ needs.unit-tests.result }}" == "failure" ]]; then
        echo "CI FAILED"
        exit 1
      fi
      echo "CI PASSED"
```
