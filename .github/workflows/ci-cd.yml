name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io


jobs:

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy pytest pytest-cov

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      - name: Black check
        run: black --check .

      - name: isort check
        run: isort --check-only .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy . --ignore-missing-imports
        continue-on-error: true


  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif


  unit-tests:
    runs-on: ubuntu-latest

    services:
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio cassandra-driver

      - name: Wait Cassandra
        run: |
          for i in {1..30}; do
            nc -z localhost 9042 && break
            echo "Waiting Cassandra..."
            sleep 10
          done

      - name: Run tests
        run: pytest tests/ -v


  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t ghcr.io/${{ github.repository }}:latest .


  status:
    runs-on: ubuntu-latest
    needs: [code-quality, security, unit-tests, build]
    if: always()

    steps:
      - name: Final status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
