name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:

# -------------------------
# CODE QUALITY
# -------------------------
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy pytest

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      # ✅ BLACK FIX
      - name: Format check (Black)
        run: black --check .

      # ✅ ISORT FIX
      - name: Import check (isort)
        run: isort --check-only .

      # LINT
      - name: Lint (flake8)
        run: flake8 .

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports
        continue-on-error: true


# -------------------------
# SECURITY
# -------------------------
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF (CodeQL v3 FIX)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif


# -------------------------
# UNIT TESTS
# -------------------------
  unit-tests:
    runs-on: ubuntu-latest

    services:
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio cassandra-driver pytest-cov

      # ✅ FIX Cassandra startup
      - name: Wait for Cassandra
        run: |
          for i in {1..40}; do
            nc -z localhost 9042 && echo "Cassandra ready" && exit 0
            echo "Waiting Cassandra..."
            sleep 5
          done
          exit 1

      - name: Init Cassandra schema
        run: |
          python -c "
from cassandra.cluster import Cluster
import time
for i in range(10):
    try:
        cluster = Cluster(['127.0.0.1'])
        session = cluster.connect()
        session.execute(\"CREATE KEYSPACE IF NOT EXISTS arxiv WITH replication = {'class':'SimpleStrategy','replication_factor':1}\")
        print('Cassandra OK')
        break
    except Exception as e:
        print('Retry...', e)
        time.sleep(5)
"

      - name: Run tests
        run: pytest tests/ -v


# -------------------------
# INTEGRATION TESTS
# -------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Wait Cassandra
        run: sleep 60

      - name: Run integration tests
        run: pytest tests/integration -v


# -------------------------
# BUILD DOCKER
# -------------------------
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t ghcr.io/${{ github.repository }}:latest .


# -------------------------
# STATUS
# -------------------------
  status:
    runs-on: ubuntu-latest
    needs: [code-quality, security, unit-tests, build]
    if: always()

    steps:
      - name: Final status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
